<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <style>
        body {
            background: #eae3e3;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        table {
            border: 1px solid #100e0ef9;
            background-color: collapse;
            width: 60%;
            margin: auto;
        }

        th {
            border: 1px #100e0ef9;
            padding-top: 10px;
            padding-bottom: 8px;
            text-align: left;
            background-color: #ef1a1a;
            color: white;
            padding-left: 8px;

        }

        td {
            border: 1px solid #100e0ef9;
            padding: 10px;
        }


        .dob-column {
            color: rgb(29, 236, 167);

        }
    </style>
</head>
